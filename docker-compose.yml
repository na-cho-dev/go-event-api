services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: go_event_api
    ports:
      - "5440:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d go_event_api"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      args:
        VERSION: local
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENV: development
      PORT: "8080"
      DATABASE_URL: postgres://app:app@db:5432/go_event_api?sslmode=disable
      JWT_SECRET: local-development-secret-change-me-please
      AUTO_MIGRATE: "true"
      LOG_FORMAT: text
    ports:
      - "8080:8080"

volumes:
  dbdata:
