info:
  contact:
    name: Fortune Iheanacho
    url: https://nachodev.me
  description: Events and attendees with JWT authentication. Register, log in, create
    events, and manage who attends them.
  license:
    name: MIT
  title: Go Event API
  version: "1.2"
paths:
  /:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.InfoResponse'
      summary: Service information
      tags:
      - System
  /api/v1/attendees/{id}/events:
    get:
      parameters:
      - description: User ID
