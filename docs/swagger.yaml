  /api/v1/events:
    get:
      description: Paged, ordered by date. Filter with q (name or location), owner
        (user id) and from (RFC 3339).
      parameters:
      - default: 1
        description: Page number, starting at 1
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size, 1 to 100
        in: query
        name: limit
        type: integer
      - description: Match name or location
        in: query
        name: q
        type: string
      - description: Only events owned by this user
        in: query
        name: owner
        type: integer
      - description: Only events on or after this RFC 3339 instant
        in: query
        name: from
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/internal_api.ListResponse-github_com_na-cho-dev_go-event-api_internal_database_Event'
        "400":
