name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: go_event_api_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d go_event_api_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Run gofmt on:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...

      - name: Unit tests
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Integration tests
        env:
          TEST_DATABASE_URL: postgres://app:app@localhost:5432/go_event_api_test?sslmode=disable
        run: go test -race -count=1 -tags integration ./internal/database/...

      - name: Build binaries
        run: |
          CGO_ENABLED=0 go build -trimpath -o bin/api ./cmd/api
          CGO_ENABLED=0 go build -trimpath -o bin/migrate ./cmd/migrate

      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: go-event-api:ci
          build-args: VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
